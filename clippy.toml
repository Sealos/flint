# Every client is assembled in `cluster::build_client`, which puts the read-only rule on it.
# `Client::try_from` is a trait method, which clippy cannot name: scripts/check-client-construction.sh
# covers it.
disallowed-methods = [
  { path = "kube::Client::new", reason = "clients are built in cluster::build_client" },
  { path = "kube::Client::try_default", reason = "clients are built in cluster::build_client" },
]
disallowed-types = [
  { path = "kube::client::ClientBuilder", reason = "clients are built in cluster::build_client" },
]
