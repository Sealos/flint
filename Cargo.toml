[workspace]
resolver = "3"
members = ["crates/flint-core", "crates/flint-mcp", "crates/flint-app", "crates/flint-e2e"]

[workspace.package]
version = "0.2.1" # x-release-please-version
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Sealos/flint"
publish = false

[workspace.dependencies]
flint-core = { path = "crates/flint-core" }
flint-mcp = { path = "crates/flint-mcp" }

# Kubernetes. kube and k8s-openapi versions must move together (see the kube README).
kube = { version = "5.1.0", default-features = false, features = ["client", "config", "runtime", "ws", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
# The same jiff k8s-openapi uses, with the system time zone: log timestamps show in local time.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
async-channel = "2.5.0"
# Already in the tree through kube; used to read log streams.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
libc = "0.2.191"
# Already in the tree (through kube, tokio and GPUI); finds search matches in log lines.
memchr = "2.8.3"
# Already in the tree (through kube and GPUI); credential redaction for text served to agents.
regex = "1.13.2"
aho-corasick = "1.1.5"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
serde_json = "1.0.154"
# Already in the tree through kube; names the request type kube's raw request API takes.
http = "1.5.0"
# kube 5.1 parses kubeconfig with serde-saphyr; reuse the same YAML implementation for output.
serde-saphyr = "=2.2.0"
# Already in the tree through GPUI; writes automation screenshots as PNG (test builds only).
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Terminal emulation for exec sessions (the grid model Zed and Alacritty use). No serde.
alacritty_terminal = { version = "0.26.0", default-features = false }

# The fake API server in flint-e2e. All but rcgen are already in the tree through kube.
hyper = { version = "1.12.0", features = ["server", "http1"] }
# Also flint-core's client stack (`cluster::build_client`), which sets TCP keepalive.
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Already in the tree through kube; the rest of `cluster::build_client`'s stack, as kube builds it.
hyper-timeout = "0.5.2"
tower = { version = "0.5.3", default-features = false, features = ["util", "retry", "filter"] }
# Already in the tree through kube; the type of kubeconfig secrets Flint sets (`auth_plugin`).
secrecy = "0.10.3"
http-body-util = "0.1.5"
bytes = "1.12.2"
tokio-rustls = { version = "0.26.6", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# Already in the tree through rustls; HMAC-SHA256 and the key for the activity log's server keys.
ring = "0.17.14"
base64 = "0.22.1"
# The server side of the fake exec WebSocket: the same tokio-tungstenite kube's client uses.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# Generates the fake server's throwaway CA and certificate at test time (github.com/rustls/rcgen).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

# MCP: the official Rust SDK (github.com/modelcontextprotocol/rust-sdk).
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-io"] }

# UI. gpui-kit is the single crate upstream (longbridge/gpui-kit) tells applications to depend on.
# It pins the exact GPUI snapshot (`gpui-pre =0.3.12`) that gpui-component 0.10.0 was built against
# and re-exports GPUI and gpui-component. Pin exactly: GPUI APIs change between releases.
# `tree-sitter-yaml` highlights the read-only YAML view.
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-yaml"] }

[profile.release]
strip = true
lto = "thin"

[profile.dev.package]
# Recommended by gpui-kit: these are very slow unoptimized.
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
# PNG encoding for automation screenshots (test builds): a 2560x1490 capture takes about 0.4 s
# instead of 0.9 s.
image = { opt-level = 3 }
"png@0.18.1" = { opt-level = 3 }
fdeflate = { opt-level = 3 }
"miniz_oxide@0.8.9" = { opt-level = 3 }
crc32fast = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
# Credential redaction of logs served to agents (`flint_core::redact`): a 10 MB log takes about
# 0.05 s instead of 0.25 s in test builds.
regex-automata = { opt-level = 3 }
aho-corasick = { opt-level = 3 }
memchr = { opt-level = 3 }
