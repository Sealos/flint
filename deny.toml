# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices only fail for crates we depend on directly;
# transitive ones (mostly through GPUI) are upstream's to replace.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
# Everything here is compatible with shipping Flint under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "NCSA",
  "CDLA-Permissive-2.0", # webpki-root-certs (Mozilla's CA list)
  "MPL-2.0",             # weak copyleft per file: fine for unmodified dependencies
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
