version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # kube and k8s-openapi must move together (see the kube README).
      kubernetes:
        patterns: ["kube", "kube-*", "k8s-openapi"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: GPUI APIs change between releases. Upgrade deliberately.
      - dependency-name: gpui-kit
      - dependency-name: rmcp
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
