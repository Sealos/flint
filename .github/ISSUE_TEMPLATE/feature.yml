name: Feature request
description: Suggest something Flint should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or problem, before any solution. Say what you do today instead.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Flint to do
    validations:
      required: false
  - type: input
    id: flint-version
    attributes:
      label: Flint version
      description: Choose **Flint > About Flint** or run `flint --version`.
      placeholder: "0.2.1"
  - type: input
    id: os
    attributes:
      label: Operating system and version, if it matters here
      placeholder: "macOS 15.4, Ubuntu 24.04"
  - type: dropdown
    id: auth
    attributes:
      label: Authentication plugin, if relevant
      options:
        - EKS
        - GKE
        - AKS
        - Other
        - None
  - type: textarea
    id: logs
    attributes:
      label: Flint logs, if relevant
      description: |
        If logs help explain the request, paste an excerpt from `~/Library/Logs/Flint/flint.log` on macOS or
        `$XDG_STATE_HOME/flint/flint.log` on Linux (default `~/.local/state/flint/flint.log`). Remove cluster names,
        server URLs, credentials and other private details before sharing. Do not upload kubeconfig files or credentials.
