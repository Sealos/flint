name: Bug report
description: Something in Flint does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe how you launched Flint and what you did. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: flint-version
    attributes:
      label: Flint version
      description: |
        Choose **Flint > About Flint** or run `flint --version`. For the macOS app without `flint` on your PATH,
        run `/Applications/Flint.app/Contents/MacOS/flint --version`. If you can't check, enter the release tag or download filename.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - macOS app (DMG)
        - macOS command-line archive
        - Linux AppImage
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: On macOS, choose Apple menu > About This Mac. On Linux, include your distribution and version.
      placeholder: macOS 15.1 on Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication plugin
      options:
        - EKS (aws eks get-token / aws-iam-authenticator)
        - GKE (gke-gcloud-auth-plugin)
        - AKS (kubelogin)
        - Other exec plugin or legacy auth-provider
        - None
        - Unknown
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Keep private data out of this public report.** Remove cluster names, server URLs, credentials and other
        private details from any logs before sharing. Do not upload kubeconfig files or credentials.
  - type: textarea
    id: logs
    attributes:
      label: Flint log file
      description: |
        On macOS, the log is `~/Library/Logs/Flint/flint.log`. Use **Go > Go to Folder** in Finder to open `~/Library/Logs/Flint/`.
        On Linux, look in `$XDG_STATE_HOME/flint/flint.log` (default `~/.local/state/flint/flint.log`).
        Attach a sanitized copy of the relevant log or paste the relevant lines. If the log rotated, check
        `flint.log.1` through `flint.log.3`. For an MCP tool error, include the tool name and the sanitized error shown by your AI client.
