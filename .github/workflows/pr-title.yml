name: PR title

# PRs are squash-merged and release-please reads the squashed subject, so the PR title must be a
# Conventional Commit (feat:, fix:, docs:, ci:, …).
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # A merge group has no PR title to read. The title was checked on the PR; this event only makes
  # the required check report, so the queue does not wait for it forever.
  merge_group:

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: github.event_name != 'merge_group'
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            ci
            build
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject should start with a lowercase letter.
