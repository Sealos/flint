name: Memory

# Nightly memory checks. Too slow for every PR; failures open as red runs on master.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/memory.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # AddressSanitizer with LeakSanitizer (on by default on Linux): leaks and memory errors in
  # flint-core and flint-mcp, including the C libraries they link and Flint's few `unsafe` blocks.
  # `--target` keeps build scripts and proc macros uninstrumented.
  sanitizers:
    name: leak-sanitizer (core, mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      # Tests that need a cluster stay #[ignore]d here.
      FLINT_CONFIG_DIR: ${{ github.workspace }}/target/memory-flint-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: nightly
      # Without a symbolizer, leak reports are bare addresses.
      - name: Install llvm-symbolizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
          symbolizer=$(command -v llvm-symbolizer)
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      # --no-fail-fast: a leak in one test binary must not hide the others' reports.
      - name: Tests under AddressSanitizer and LeakSanitizer
        run: >
          cargo +nightly test -p flint-core -p flint-mcp --lib --tests --locked
          --target x86_64-unknown-linux-gnu --no-fail-fast

  # UP-26: the whole app with 10,000 pods on the fake API server. Its numbers are an artifact.
  # Not on PRs that edit this file: macOS runners cost about ten times as much as Linux ones.
  macos-load:
    name: macos-load (up-26)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # rust-cache keys on these: they match ci.yml's macos-tests job, whose cache is restored below.
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-tests
          save-if: false
      - name: Build the app with the automation channel
        run: cargo build -p flint-app --features automation --bin flint --locked
      - name: UP-26 load test
        timeout-minutes: 15
        env:
          FLINT_E2E_APP_BIN: ${{ github.workspace }}/target/debug/flint
          FLINT_E2E_LOAD_REPORT: ${{ runner.temp }}/up-26-load.json
        run: >
          cargo test -p flint-e2e --test app --locked --
          --ignored --exact load::up_26_large_list_stays_responsive --nocapture
      - name: Upload the load numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: up-26-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/up-26-load.json
          if-no-files-found: warn
          retention-days: 30
