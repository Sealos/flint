name: CI base change

# A PR's checks are classified against its base, so moving it to another base can leave a smoke
# result for a diff that now needs the full suite. `edited` also fires on title and body edits,
# and a skipped run of CI would replace finished required checks, so this separate workflow
# listens for it and starts CI and Lint on the head branch only when the base changed.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  rerun:
    name: rerun after base change
    if: github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start CI and Lint on the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::A fork's branch cannot be started from here. Push a commit to rerun CI."
            exit 1
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF"
          gh workflow run lint.yml --repo "$REPO" --ref "$HEAD_REF"
