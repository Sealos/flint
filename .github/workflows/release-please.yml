name: Release

# release-please keeps a release PR open with the next version and changelog, built from
# Conventional Commits on master. Merging that PR tags the release; the build job below then
# attaches the macOS binaries to it.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version in Cargo.toml but cannot update Cargo.lock, and CI builds
  # with --locked. Refresh the workspace entries on the release PR branch.
  update-lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Update workspace versions in Cargo.lock
        run: cargo update --workspace
      - name: Commit if changed
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock for release"
          git push

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build arm64
        run: cargo build --release --locked -p flint-app --target aarch64-apple-darwin
      - name: Build x86_64
        run: cargo build --release --locked -p flint-app --target x86_64-apple-darwin
      - name: Create universal binary
        run: |
          mkdir -p dist/flint
          lipo -create -output dist/flint/flint \
            target/aarch64-apple-darwin/release/flint \
            target/x86_64-apple-darwin/release/flint
          lipo -info dist/flint/flint
          test "$(dist/flint/flint --version)" = "flint $VERSION"
          cp LICENSE README.md dist/flint/
      - name: Package
        run: |
          ARCHIVE="flint-${TAG}-macos-universal.tar.gz"
          tar -czf "$ARCHIVE" -C dist flint
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      # Releases are immutable once published, so release-please creates a draft (with the tag) and
      # this step attaches the binaries before publishing it. Unsigned until M6; 0.x is a pre-release.
      - name: Upload and publish the release
        run: |
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          case "$VERSION" in
            0.*) gh release edit "$TAG" --draft=false --prerelease ;;
            *) gh release edit "$TAG" --draft=false ;;
          esac
      # Never leave a published release that nobody can install.
      - name: Check the published release has its binaries
        run: |
          names=$(gh release view "$TAG" --json isDraft,assets --jq 'select(.isDraft == false) | .assets[].name')
          for want in "$ARCHIVE" "$ARCHIVE.sha256"; do
            grep -qxF "$want" <<<"$names" || { echo "::error::release $TAG is missing $want"; exit 1; }
          done
