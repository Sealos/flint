name: Release

# release-please keeps a release PR open with the next version and changelog, built from
# Conventional Commits on master. Merging that PR tags the release as a draft; the build jobs
# below build the macOS binary, Flint.app's DMG and the Linux AppImages, `upload` attaches them
# to it, and `publish` publishes it once all of them have been uploaded.
on:
  push:
    branches: [master]

# No token scopes by default; each job asks for what it uses. The build jobs run cargo, build
# scripts and packaging tools, so they get a read-only token and hand their files to `upload`
# as run artifacts.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# bash -eo pipefail, so a failing command before a pipe (`package-macos-app.sh | tee`) fails its
# step.
defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Opens and updates the release PR, and creates the tag and the draft release.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version in Cargo.toml but cannot update Cargo.lock, and CI builds
  # with --locked. Refresh the workspace entries on the release PR branch.
  update-lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    # Only Cargo.lock changes here; no build, so Linux is enough.
    runs-on: ubuntu-latest
    # Pushes the Cargo.lock commit to the release PR branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Update workspace versions in Cargo.lock
        run: cargo update --workspace
      - name: Commit if changed
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock for release"
          git push

  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    # Two release builds (about 15 minutes each on a cold cache) plus packaging; a hung step must
    # not hold the runner for the default six hours.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Keeps even the read-only token out of .git/config, away from cargo build scripts.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build arm64
        run: cargo build --release --locked -p flint-app --target aarch64-apple-darwin
      - name: Build x86_64
        run: cargo build --release --locked -p flint-app --target x86_64-apple-darwin
      # The test-only automation channel must not ship (docs/TESTING.md).
      - name: No automation channel
        run: |
          scripts/check-no-automation.sh target/aarch64-apple-darwin/release/flint
          scripts/check-no-automation.sh target/x86_64-apple-darwin/release/flint
      - name: Create universal binary
        run: |
          mkdir -p dist/flint
          lipo -create -output dist/flint/flint \
            target/aarch64-apple-darwin/release/flint \
            target/x86_64-apple-darwin/release/flint
          lipo -info dist/flint/flint
          test "$(dist/flint/flint --version)" = "flint $VERSION"
          cp LICENSE README.md dist/flint/
      - name: Package
        run: |
          ARCHIVE="flint-${TAG}-macos-universal.tar.gz"
          tar -czf "$ARCHIVE" -C dist flint
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      # The same universal binary as Flint.app (ad-hoc signed until #25) in a drag-to-Applications
      # DMG, next to the tarball.
      - name: Package Flint.app and the DMG
        run: |
          scripts/package-macos-app.sh dist/flint/flint "$VERSION" dist/app | tee package.log
          DMG="flint-${TAG}-macos-universal.dmg"
          # The script prints the DMG's path last; it must be the name `publish` checks for.
          test "$(basename "$(tail -n 1 package.log)")" = "$DMG"
          mv "dist/app/$DMG" "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      # Mounts the DMG: bundle ID, signature, --version, mcp, and no automation channel.
      - name: Smoke test the DMG
        run: scripts/smoke-macos-app.sh "$DMG" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          if-no-files-found: error
          # As long as GitHub allows re-running failed jobs, so a re-run of `upload` still finds them.
          retention-days: 30

  # One AppImage per architecture (ADR-0016), each built natively: linuxdeploy inspects the
  # binary with the host's loader. Both on Ubuntu 24.04, not ubuntu-latest: the binary needs the
  # build image's glibc (2.39) or newer, and the README promises that floor.
  build-linux:
    name: build-linux (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Keeps even the read-only token out of .git/config, away from cargo build scripts.
          persist-credentials: false
      - uses: ./.github/actions/gpui-linux-deps
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
      - name: Release build
        run: cargo build --release --locked -p flint-app
      # On the ELF binary, before the AppImage compresses it (docs/TESTING.md).
      - name: No automation channel
        run: scripts/check-no-automation.sh ./target/release/flint
      - name: Package
        run: |
          scripts/package-appimage.sh target/release/flint "$VERSION" "${{ matrix.arch }}"
          APPIMAGE="flint-${TAG}-linux-${{ matrix.arch }}.AppImage"
          test -f "$APPIMAGE"
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"
          echo "APPIMAGE=$APPIMAGE" >> "$GITHUB_ENV"
      - name: Smoke test
        run: scripts/smoke-appimage.sh "$APPIMAGE" "$VERSION"
      # Again with only the host packages the README documents (see ci.yml).
      - name: Smoke test in a clean Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w -e APPIMAGE -e VERSION -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8 \
            bash -c 'apt-get update -qq &&
              grep -v "^#" packaging/linux/ubuntu-runtime-packages.txt |
                xargs apt-get install -y -qq --no-install-recommends >/dev/null &&
              scripts/smoke-appimage.sh "$APPIMAGE" "$VERSION"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE }}.sha256
          if-no-files-found: error
          retention-days: 30

  # Releases are immutable once published, so release-please creates a draft (with the tag);
  # this job attaches every build's files to the draft and `publish` publishes it. Kept apart
  # from the builds so only this small job, which runs no project code, can write to releases.
  upload:
    needs: [release-please, build-macos, build-linux]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Run artifacts of this run need no token scope.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Upload to the draft release
        working-directory: dist
        run: |
          files=()
          for file in \
            "flint-${TAG}-macos-universal.tar.gz" \
            "flint-${TAG}-macos-universal.dmg" \
            "flint-${TAG}-linux-x86_64.AppImage" \
            "flint-${TAG}-linux-aarch64.AppImage"; do
            for want in "$file" "$file.sha256"; do
              [ -s "$want" ] || { echo "::error::build artifacts are missing $want"; exit 1; }
              files+=("$want")
            done
          done
          gh release upload "$TAG" "${files[@]}" --clobber

  # Runs once, after every binary is on the draft. A release is published only when complete,
  # as a full release; it becomes Latest unless a newer release already is.
  publish:
    needs: [release-please, upload]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Reads the draft (drafts are visible only with write access) and publishes it.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Every binary and its checksum must be on the draft, non-empty, and match: a name alone
      # would pass a zero-size or half-uploaded (--clobber re-run) file.
      - name: Check the draft has every binary, intact
        run: |
          mkdir -p assets && cd assets
          for file in \
            "flint-${TAG}-macos-universal.tar.gz" \
            "flint-${TAG}-macos-universal.dmg" \
            "flint-${TAG}-linux-x86_64.AppImage" \
            "flint-${TAG}-linux-aarch64.AppImage"; do
            for want in "$file" "$file.sha256"; do
              gh release download "$TAG" --pattern "$want" --clobber ||
                { echo "::error::release $TAG is missing $want"; exit 1; }
              [ -s "$want" ] || { echo "::error::release $TAG has an empty $want"; exit 1; }
            done
            sha256sum -c "$file.sha256" ||
              { echo "::error::$file does not match $file.sha256"; exit 1; }
          done
      # Latest only moves forward: retrying an older draft after a newer release has shipped must
      # not send /releases/latest back to the older build.
      - name: Publish the release
        run: |
          current=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "${current#v}" "${TAG#v}" | sed '/^$/d' | sort -V | tail -n1)
          if [ -z "$current" ] || [ "$newest" = "${TAG#v}" ]; then latest=true; else latest=false; fi
          echo "current Latest: ${current:-none}; marking $TAG Latest: $latest"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          gh release edit "$TAG" --draft=false --prerelease=false --latest="$latest"
      - name: Check the release is published
        run: |
          gh release view "$TAG" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("release \(env.TAG) is not a full release") else "ok" end'
          if [ "$LATEST" = true ]; then
            got=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            [ "$got" = "$TAG" ] || { echo "::error::Latest is $got, not $TAG"; exit 1; }
          fi
