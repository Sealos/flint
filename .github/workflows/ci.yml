name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  # Started by ci-base-change.yml when a PR moves to another base. Runs the full suite.
  workflow_dispatch:

permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Tests that need a cluster are #[ignore]d and run only with --include-ignored and
  # FLINT_TEST_KUBECONFIG; CI runs neither, so they show as "ignored", never as passed.
  FLINT_CONFIG_DIR: ${{ github.workspace }}/target/ci-flint-config

jobs:
  # Which checks this change needs (scripts/ci-changes.sh): a docs-only PR skips the builds.
  # Pushes to master run everything. If this job fails, every gated job runs (fail open).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A full run does every job, whatever the paths (the `mode` and `queue` steps).
      rust: ${{ steps.mode.outputs.full == 'true' && 'true' || steps.filter.outputs.rust }}
      # A smoke PR builds the packages only when it changes their packaging.
      appimage: ${{ steps.mode.outputs.full == 'true' && 'true' || steps.mode.outputs.full == 'false' && steps.mode.outputs.packaging || steps.filter.outputs.appimage }}
      # In the merge queue, the `queue` step decides; everywhere else, the filter.
      macos: ${{ (steps.mode.outputs.full == 'true' || steps.queue.outputs.full == 'true') && 'true' || steps.queue.outputs.macos || steps.filter.outputs.macos }}
      # `false` only on a smoke PR. Jobs read anything else, a failed job included, as full.
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-changes.sh "$BASE" "$HEAD"
          else
            scripts/ci-changes.sh --all
          fi
      # A merge group runs every Linux check (--all above), and macOS only when its diff can change
      # the app: the filter's `macos` group (Rust inputs, the automation check, CI itself). Those
      # runners are scarce, and master still runs macOS after every merge. Missing SHAs select
      # every group, and a failed diff fails this job, which also runs every gated job.
      - id: queue
        if: github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            scripts/ci-changes.sh "$BASE" "$HEAD"
            scripts/ci-changes.sh --suite "$BASE" "$HEAD"
          else
            scripts/ci-changes.sh --all
            scripts/ci-changes.sh --suite --all
          fi
      # Ordinary PRs get a smoke run; master and the merge queue always run the full suite. A PR
      # runs it too with the full-ci label or when a path needs it (scripts/ci-changes.sh).
      # Labels are read when a run starts, and `labeled` is deliberately not a trigger: it would
      # replace finished required checks. After labelling, push a commit or close and reopen the
      # PR.
      - id: mode
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL_LABEL" = true ]; then
            scripts/ci-changes.sh --suite --all
          else
            scripts/ci-changes.sh --suite "$BASE" "$HEAD"
          fi

  # Names which suite this run used, because a smoke `test (*)` passes under the same check name
  # as a full one. Not a required check.
  suite:
    name: suite (${{ needs.changes.result == 'success' && needs.changes.outputs.full == 'false' && 'smoke' || 'full' }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "The check name records the suite."

  fmt:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # macOS runners cost about ten times as much as Linux ones, so only the app's macOS checks run
  # on macOS. flint-core, flint-mcp and flint-e2e (the fake API server, no GPUI) build and test
  # on Linux, and so does the app (linux-app).
  clippy:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          # A queue branch's cache is never restored by master; it would only use up the budget.
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: cargo clippy -p flint-core -p flint-mcp -p flint-e2e --all-targets --locked -- -D warnings

  # One job per crate, so a failure points at the module that broke. flint-app's tests run in
  # the macOS job below.
  test:
    name: test (${{ matrix.crate }})
    needs: changes
    # Gated per step, not per job: a skipped matrix job reports its check unexpanded
    # ("test (${{ matrix.crate }})"), so the required check would never arrive.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
      FULL: ${{ needs.changes.result != 'success' || needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [flint-core, flint-mcp, flint-e2e]
        # The smoke set of each crate, and the fewest passes that prove its filters still match.
        include:
          - crate: flint-core
            smoke: "--lib -- --color never protection:: read_only:: redact::tests::"
            smoke-min: 37
          - crate: flint-mcp
            smoke: --test mcp_stdio -- --color never
            smoke-min: 5
          - crate: flint-e2e
            smoke: --test write_gate --test protected_cluster -- --color never
            smoke-min: 10
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Read-only, from the cache cluster-e2e.yml saves on master: it holds the compiled test
      # dependencies of these three crates. The `linux` cache is saved by clippy and holds only
      # check metadata, so restoring it here rebuilt about 200 dependencies in every job.
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-cluster-e2e
          save-if: false
      # The MCP e2e tests run flint-mcp; build it here rather than inside the tests.
      - if: env.RUN == 'true' && (matrix.crate == 'flint-e2e')
        run: cargo build -p flint-mcp --bin flint-mcp --locked
      - if: env.RUN == 'true' && env.FULL == 'true'
        run: cargo test -p ${{ matrix.crate }} --locked
        env:
          FLINT_E2E_MCP_BIN: ${{ matrix.crate == 'flint-e2e' && format('{0}/target/debug/flint-mcp', github.workspace) || '' }}
      - name: Build every test, run the smoke set
        if: env.RUN == 'true' && env.FULL != 'true'
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
          SMOKE: ${{ matrix.smoke }}
          SMOKE_MIN: ${{ matrix.smoke-min }}
          FLINT_E2E_MCP_BIN: ${{ matrix.crate == 'flint-e2e' && format('{0}/target/debug/flint-mcp', github.workspace) || '' }}
        run: |
          cargo test -p "$CRATE" --locked --no-run
          # shellcheck disable=SC2086 # one argument per word
          cargo test -p "$CRATE" --locked $SMOKE | tee smoke.log
          passed=$(awk '/^test result:/ { n += $4 } END { print n + 0 }' smoke.log)
          if [ "$passed" -lt "$SMOKE_MIN" ]; then
            echo "::error::smoke set ran $passed passing tests, expected at least $SMOKE_MIN"
            exit 1
          fi

  docs:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false
      - run: cargo doc -p flint-core -p flint-mcp -p flint-e2e --no-deps --document-private-items --locked
        # On the step, not the job: rust-cache hashes RUST* variables into its key, so a job-level
        # value here never matched the `linux` cache and every run rebuilt the dependencies.
        env:
          RUSTDOCFLAGS: -D warnings

  # The app on Linux: GPUI builds there (X11/Wayland), and the headless view tests use GPUI's
  # test platform, so they run without a display. Flint ships a Linux AppImage (ADR-0016); the
  # `appimage` job below packages it.
  linux-app:
    name: linux (flint-app)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gpui-linux-deps
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-app
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy -p flint-app --all-targets --locked -- -D warnings
      - name: Clippy (automation channel)
        run: cargo clippy -p flint-app --all-targets --features automation --locked -- -D warnings
      # One test run, as on macOS: the automation build compiles every test, the channel's too.
      - name: Tests (with the automation channel)
        if: needs.changes.result != 'success' || needs.changes.outputs.full != 'false'
        # GPUI's leak detector: view tests that check a closed view was released
        # (`assert_released`, `assert_no_new_leaks`) list each leaked handle on failure.
        env:
          GPUI_LEAK_DETECTION: "1"
        run: cargo test -p flint-app --features automation --locked
      - name: Build every test, run the smoke set
        if: needs.changes.result == 'success' && needs.changes.outputs.full == 'false'
        shell: bash
        env:
          GPUI_LEAK_DETECTION: "1"
          SMOKE_MIN: "43"
        run: |
          cargo test -p flint-app --features automation --locked --no-run
          cargo test -p flint-app --features automation --locked --bin flint -- --color never \
            ui::write_confirm ui::registry:: ui::theme:: | tee smoke.log
          passed=$(awk '/^test result:/ { n += $4 } END { print n + 0 }' smoke.log)
          if [ "$passed" -lt "$SMOKE_MIN" ]; then
            echo "::error::smoke set ran $passed passing tests, expected at least $SMOKE_MIN"
            exit 1
          fi

  # The release build packaged as an AppImage, as release-please does, then run without FUSE:
  # `--version` and `mcp` through the AppImage. x86_64 only; the release also builds aarch64. On
  # Ubuntu 24.04 like the release, whose glibc sets the AppImage's floor.
  appimage:
    name: appimage (x86_64)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.appimage == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gpui-linux-deps
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-appimage
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Release build
        run: cargo build --release --locked -p flint-app
      # On the ELF binary: the AppImage compresses it, so its strings cannot be searched.
      - name: Release binary has no automation channel
        run: scripts/check-no-automation.sh ./target/release/flint
      - name: Package
        run: |
          VERSION=$(./target/release/flint --version | cut -d' ' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/package-appimage.sh target/release/flint "$VERSION" x86_64
      - name: Smoke test
        run: scripts/smoke-appimage.sh "flint-v$VERSION-linux-x86_64.AppImage" "$VERSION"
      # The runner has every -dev package installed, so the test above cannot catch a library the
      # AppImage expects from the host. Run it again where only the documented packages are.
      - name: Smoke test in a clean Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w -e VERSION -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8 \
            bash -c 'apt-get update -qq &&
              grep -v "^#" packaging/linux/ubuntu-runtime-packages.txt |
                xargs apt-get install -y -qq --no-install-recommends >/dev/null &&
              scripts/smoke-appimage.sh "flint-v$VERSION-linux-x86_64.AppImage" "$VERSION"'

  # The static musl `flint-mcp` the release ships for Linux, built and checked as release-please
  # does: in a bare Ubuntu 22.04, `--version`, `initialize` and the MCP e2e tests on the fake API
  # server. x86_64 only; the release also builds aarch64.
  mcp-linux:
    name: mcp-linux (x86_64)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.appimage == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-mcp-musl
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build and package
        # bash -eo pipefail, so a failing build before `| tee` fails the step.
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)" # x-release-please-version$/\1/p' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/package-mcp-linux.sh x86_64 "$VERSION" | tee package.log
          echo "ARCHIVE=$(basename "$(tail -n 1 package.log)")" >> "$GITHUB_ENV"
      - name: Smoke test in a clean Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w -e ARCHIVE -e VERSION \
            ubuntu:22.04@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6 \
            scripts/smoke-mcp-linux.sh "$ARCHIVE" "$VERSION"
      - name: MCP e2e in a clean Ubuntu 22.04
        run: scripts/test-mcp-linux.sh x86_64 "$ARCHIVE"

  # Everything that needs macOS, in one job so one VM is paid for: the app's clippy, view tests
  # and docs (also with the test-only automation channel), and a release build that catches
  # profile-only problems (LTO, strip) before release-please does, and proves the automation
  # channel is not in it.
  # Also runs the app e2e tests (docs/TESTING.md, "Running app e2e"): macOS runners are costly,
  # so they share this job's build instead of getting their own. Read-only; the PR comment that
  # links the screenshots is posted by the Linux job below.
  # Not on PRs by default: it takes about 15 minutes on a runner that costs ten times a Linux
  # one, and linux (flint-app) already runs the app's clippy and tests. It runs on every push to
  # master, so a macOS-only break shows up there before a release is cut. Add the run-macos
  # label to a PR to run it before merging (for example, macOS-only code or packaging changes);
  # the label counts from the next push, so add it before pushing (labelling alone does not
  # start CI, which would rerun every other job too). On a labelled PR it runs whatever the
  # paths are.
  macos:
    name: macos (flint-app)
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request'
      && (contains(github.event.pull_request.labels.*.name, 'run-macos')
      || needs.changes.result != 'success'
      || needs.changes.outputs.full == 'true' && needs.changes.outputs.macos == 'true')
      || github.event_name != 'pull_request'
      && (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: -D warnings
    outputs:
      screenshots-url: ${{ steps.screenshots.outputs.artifact-url }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy -p flint-app --all-targets --locked -- -D warnings
      - name: Clippy (automation channel)
        run: cargo clippy -p flint-app --all-targets --features automation --locked -- -D warnings
      # One test run: the automation build compiles every test, the channel's too. The plain
      # build is still checked by clippy above. With GPUI's leak detector, as on Linux: the
      # channel's task lives as long as the app and must not keep the workspace alive.
      - name: Tests (with the automation channel)
        env:
          GPUI_LEAK_DETECTION: "1"
        run: cargo test -p flint-app --features automation --locked
      # The step above built target/debug/flint with the automation channel (the `flint mcp`
      # integration test needs the binary). Reuse it rather than building again, but check it.
      - name: App binary has the automation channel
        run: |
          if ! strings -a target/debug/flint | grep -c 'automation\.sock' > /dev/null; then
            echo "::error::target/debug/flint was not built with --features automation"
            exit 1
          fi
          # What GPUI renders with here, for diagnosing a screenshot or window failure.
          system_profiler SPDisplaysDataType || true
      - name: Docs
        run: cargo doc -p flint-app --no-deps --document-private-items --locked
      - name: Release build
        run: cargo build --release --locked -p flint-app
      - run: ./target/release/flint --help
      # The automation channel is test-only (docs/TESTING.md): it must not be in what ships.
      - name: Release binary has no automation channel
        run: scripts/check-no-automation.sh ./target/release/flint
      # The real app, driven over its automation socket, one test per user path, against the
      # fake API server. Failures fail the job; the screenshots are only uploaded. Last, so a
      # failure here does not hide the docs and release checks above. It needs only
      # target/debug/flint, which the release build does not touch.
      - name: App e2e
        id: e2e
        # A hung window or socket wait must not hold the runner for the job's full hour.
        timeout-minutes: 15
        env:
          FLINT_E2E_APP_BIN: ${{ github.workspace }}/target/debug/flint
          FLINT_AUTOMATION_SCREENSHOTS: ${{ runner.temp }}/e2e-shots
        # The kind test returns early without FLINT_TEST_KUBECONFIG; skip it so it never shows as passed.
        # The UP-26 load test runs nightly (`macos-load` in memory.yml).
        run: >
          cargo test -p flint-e2e --test app --locked -- --ignored
          --skip up_41_shell_on_kind --skip up_26_large_list_stays_responsive
      - name: Upload app e2e screenshots
        id: screenshots
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-e2e-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-shots/*.png
          if-no-files-found: warn
          retention-days: 14

  # Posts (or updates) one comment on the PR linking the app e2e screenshots. A cheap Linux job,
  # so the macOS job keeps read-only permissions. Same-repo PRs only: a fork's token cannot
  # write, and its screenshots need no comment to be found on the run page.
  app-e2e-comment:
    name: app e2e screenshots comment
    needs: macos
    # Also when an earlier macOS step failed (the comment then says e2e did not run, so it never
    # shows an older result). Not for Dependabot: its runs get a read-only token.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && needs.macos.result != 'skipped'
    # One comment writer per PR at a time, so two pushes cannot both post. Queued, not cancelled.
    concurrency:
      group: app-e2e-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.macos.outputs.screenshots-url }}
          OUTCOME: ${{ needs.macos.outputs.e2e }}
          RUN_ID: ${{ github.run_id }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- flint-app-e2e-screenshots -->'
          # A newer push owns the comment: an older run finishing late must not overwrite it.
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$head" != "$SHA" ]; then
            echo "PR head is now ${head:0:7}; not commenting for ${SHA:0:7}"
            exit 0
          fi
          # The job outputs come from a job that ran PR code; accept only the expected shapes.
          case "$OUTCOME" in
            success|failure|cancelled) result="\`$OUTCOME\`" ;;
            *) result="not run (an earlier step of \`macos (flint-app)\` failed)" ;;
          esac
          if [[ "$URL" =~ ^https://github\.com/${REPO}/actions/runs/${RUN_ID}/artifacts/[0-9]+$ ]]; then
            link="[Download the screenshots]($URL) (light and dark, one per key view)."
          else
            link="No screenshots were uploaded; see [the run]($RUN)."
          fi
          body="$marker
          **App e2e** for ${SHA:0:7}: $result ([run]($RUN)).

          $link E2e failures fail \`macos (flint-app)\`; the screenshots are for review."
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=$(printf '%s\n' "$ids" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
