name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Tests that need a cluster are #[ignore]d and run only with --include-ignored and
  # FLINT_TEST_KUBECONFIG; CI runs neither, so they show as "ignored", never as passed.
  FLINT_CONFIG_DIR: ${{ github.workspace }}/target/ci-flint-config

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # macOS runners cost about ten times as much as Linux ones, so only the app, which is a
  # macOS GPUI app, runs on macOS. flint-core, flint-mcp and flint-e2e (the fake API server,
  # no GPUI) build and test on Linux.
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
      - run: cargo clippy -p flint-core -p flint-mcp -p flint-e2e --all-targets --locked -- -D warnings

  # One job per crate, so a failure points at the module that broke. flint-app's tests run in
  # the macOS job below.
  test:
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [flint-core, flint-mcp, flint-e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test -p ${{ matrix.crate }} --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: false
      - run: cargo doc -p flint-core -p flint-mcp -p flint-e2e --no-deps --document-private-items --locked

  # The app on Linux: GPUI builds there (X11/Wayland), and the headless view tests use GPUI's
  # test platform, so they run without a display. Flint ships for macOS only; this job catches
  # app breakage cheaply and alongside the macOS job.
  linux-app:
    name: linux (flint-app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-app
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy -p flint-app --all-targets --locked -- -D warnings
      - name: Tests
        # GPUI's leak detector: view tests that check a closed view was released
        # (`assert_released`, `assert_no_new_leaks`) list each leaked handle on failure.
        env:
          GPUI_LEAK_DETECTION: "1"
        run: cargo test -p flint-app --locked

  # Everything that needs macOS, in one job so one VM is paid for: the app's clippy, view tests
  # and docs (also with the test-only automation channel), and a release build that catches
  # profile-only problems (LTO, strip) before release-please does, and proves the automation
  # channel is not in it.
  macos:
    name: macos (flint-app)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy -p flint-app --all-targets --locked -- -D warnings
      - name: Clippy (automation channel)
        run: cargo clippy -p flint-app --all-targets --features automation --locked -- -D warnings
      # One test run: the automation build compiles every test, the channel's too. The plain
      # build is still checked by clippy above.
      - name: Tests (with the automation channel)
        run: cargo test -p flint-app --features automation --locked
      - name: Docs
        run: cargo doc -p flint-app --no-deps --document-private-items --locked
      - name: Release build
        run: cargo build --release --locked -p flint-app
      - run: ./target/release/flint --help
      # The automation channel is test-only (docs/TESTING.md): its socket name and log lines
      # must not be in what ships. The release binary is stripped, so look for its strings.
      - name: Release binary has no automation channel
        run: |
          if strings -a ./target/release/flint | grep -E 'automation\.sock|automation channel|flint::ui::automation'; then
            echo "::error::the release binary contains the automation channel"
            exit 1
          fi
