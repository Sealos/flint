[package]
name = "flint-app"
description = "Flint desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
flint-core.workspace = true
gpui-kit.workspace = true
tracing.workspace = true
flint-mcp.workspace = true
# Detail view: the object as JSON, its events, and a redacted YAML rendering for Secrets.
k8s-openapi.workspace = true
# The diff a YAML review shows.
similar.workspace = true
# Log timestamps in the local time zone (the same jiff as k8s-openapi's, with `tz-system`).
jiff.workspace = true
serde_json.workspace = true
# Typed arguments of registered actions.
serde.workspace = true
serde-saphyr.workspace = true

# The automation channel only (feature `automation`).
async-channel = { workspace = true, optional = true }
image = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

# Asks macOS for the notification permission and reports what it answers. GPUI's own call
# does not say whether a notification was refused.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[features]
# The test-only automation channel (docs/TESTING.md). Never in release builds. GPUI's test
# support renders the window to an image for screenshots.
automation = ["dep:async-channel", "dep:image", "dep:libc", "gpui-kit/test-support"]

[dev-dependencies]
# Pod lists answered by hand in the row action tests.
async-channel.workspace = true
# `exec::fake`: shell tab tests drive a session without a pod.
flint-core = { workspace = true, features = ["test-support"] }
# The fake API server: the write confirmation tests assert the exact requests it records.
flint-e2e = { path = "../flint-e2e" }
# Headless GPUI windows for view tests (`#[gpui_kit::test]`).
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# `ApiResource`, to build stub discovery (`KindInfo`) in tests.
kube.workspace = true
