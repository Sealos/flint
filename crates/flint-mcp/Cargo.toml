[package]
name = "flint-mcp"
description = "Read-only MCP server for Flint (stdio). Must never depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The server without the desktop app, so it builds where GPUI does not (Linux CI). Users run
# `flint mcp`; see docs/TESTING.md.
[[bin]]
name = "flint-mcp"
path = "src/main.rs"

[dependencies]
flint-core.workspace = true
rmcp.workspace = true
kube.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
