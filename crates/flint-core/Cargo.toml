[package]
name = "flint-core"
description = "Kubernetes core for Flint. Must never depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kube.workspace = true
k8s-openapi.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
async-channel.workspace = true
futures.workspace = true
notify.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
libc.workspace = true
memchr.workspace = true
regex.workspace = true
aho-corasick.workspace = true
# `redact::text`: docker config `auth` values; already in the tree through kube.
base64.workspace = true
http.workspace = true
# The client stack with TCP keepalive (`cluster::build_client`); all already in the tree through kube.
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
hyper-timeout.workspace = true
tower.workspace = true
# Exec auth plugins run by Flint (`auth_plugin`): kubeconfig secrets and token expiry, both
# already in the tree through kube.
secrecy.workspace = true
jiff.workspace = true
# Already in the tree through kube; names TLS handshake failures (`api_error`).
rustls.workspace = true
# Already in the tree through rustls; keys the activity log's server URLs (`activity::ServerKeys`).
ring.workspace = true
serde-saphyr.workspace = true
# `bootstrap::init_logging`, shared by the app and the MCP server.
tracing-subscriber.workspace = true
alacritty_terminal.workspace = true

[features]
# `exec::fake`: an exec session driven by the test instead of a cluster, for front-end tests.
test-support = []

[dev-dependencies]
# Integration tests set up their clusters with `cluster::connect_unrestricted_for_tests`.
flint-core = { path = ".", features = ["test-support"] }
rcgen.workspace = true
tokio-rustls.workspace = true
async-channel.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
